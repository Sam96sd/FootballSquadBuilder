<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع التشكيلات العظيم - سامر سعد</title>
    <!-- Tailwind CSS للوضع الداكن المتقدم والتصميم المتجاوب -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 p-6">
        
        <!-- الترويسة الجديدة -->
        <h1 class="text-3xl md:text-4xl font-extrabold text-center text-emerald-400 mb-8 tracking-wide drop-shadow-md">
            صانع التشكيلات العظيم - سامر سعد 👑
        </h1>

        <!-- التحكم بنمط المباراة (12 أو 14 لاعب) -->
        <div class="bg-slate-850 border border-slate-800 p-4 rounded-xl mb-6 text-center">
            <span class="block text-sm text-slate-400 mb-3 font-semibold">نمط اللعب المطلوب اليوم:</span>
            <div class="inline-flex rounded-md shadow-sm" role="group">
                <button id="btnMode12" onclick="setMatchMode(12)" class="px-5 py-2.5 text-sm font-bold rounded-r-lg border border-slate-700 bg-emerald-600 text-white transition-all">
                    12 لاعب (6 ضد 6)
                </button>
                <button id="btnMode14" onclick="setMatchMode(14)" class="px-5 py-2.5 text-sm font-bold rounded-l-lg border-y border-l border-slate-700 bg-slate-800 text-slate-400 hover:bg-slate-750 transition-all">
                    14 لاعب (6 أساسي + 1 احتياط)
                </button>
            </div>
        </div>
        
        <!-- إضافة لاعب خارجي (مؤقت) -->
        <div class="bg-slate-800/40 border border-slate-800 p-4 rounded-xl mb-6">
            <h2 class="text-lg font-bold text-emerald-400 mb-3 text-right">إضافة لاعب خارجي (غير مدرج بالملف)</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                <input id="guestName" type="text" placeholder="اسم اللاعب الخارجي" class="bg-slate-800 text-white p-2 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                
                <select id="guestPosition" class="bg-slate-800 text-white p-2 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="هجوم">المركز: هجوم</option>
                    <option value="وسط">المركز: وسط</option>
                    <option value="دفاع">المركز: دفاع</option>
                    <option value="حارس">المركز: حارس</option>
                    <option value="جوكر">المركز: جوكر</option>
                </select>

                <select id="guestRating" class="bg-slate-800 text-white p-2 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="5">التقييم الفني: ممتاز (5/5)</option>
                    <option value="4.5">التقييم الفني: جيد جداً مرتفع (4.5/5)</option>
                    <option value="4">التقييم الفني: جيد جداً (4/5)</option>
                    <option value="3.5">التقييم الفني: جيد (3.5/5)</option>
                    <option value="3">التقييم الفني: متوسط (3/5)</option>
                    <option value="2">التقييم الفني: مبتدئ (2/5)</option>
                </select>

                <button onclick="addGuest()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg transition-all">
                    إدراج بقائمة اليوم
                </button>
            </div>
        </div>

        <!-- إضافة صبيبة المتة 🧉 -->
        <div class="bg-slate-800/20 border border-amber-500/10 p-4 rounded-xl mb-6">
            <h2 class="text-lg font-bold text-amber-400 mb-3 text-right">🧉 صبيبة المتة اليوم</h2>
            <div class="flex gap-2">
                <input id="mateName" type="text" placeholder="اسم الشخص" class="bg-slate-800 text-white p-2 border border-slate-700 rounded-lg flex-1 focus:outline-none focus:ring-2 focus:ring-amber-500">
                <button onclick="addMateServer()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 px-6 rounded-lg transition-all">إضافة</button>
            </div>
            <div id="mateListContainer" class="flex flex-wrap gap-2 mt-3"></div>
        </div>

        <!-- قائمة اختيار الحاضرين -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xl font-bold text-slate-200">
                    اختر الحاضرين للعب (<span id="selectedCount" class="text-emerald-400">0</span> / <span id="requiredCount">12</span>)
                </h2>
                <button onclick="clearSelection()" class="text-sm text-red-400 hover:underline">إلغاء تحديد الكل</button>
            </div>
            
            <div id="playersGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3">
                <!-- سيتم توليد اللاعبين هنا تلقائياً -->
            </div>
        </div>

        <!-- زر التقسيم -->
        <div class="text-center mb-8">
            <button id="generateBtn" onclick="generateTeams()" disabled class="bg-slate-850 text-slate-600 font-bold text-lg py-3 px-8 rounded-xl cursor-not-allowed border border-slate-800 transition-all w-full md:w-auto">
                يرجى تحديد العدد المطلوب للبدء
            </button>
        </div>

        <!-- عرض النتائج -->
        <div id="resultsSection" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- الفريق الأول -->
                <div class="bg-slate-850 border border-emerald-500/20 p-5 rounded-xl shadow-lg">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                        <h3 class="text-2xl font-bold text-emerald-400">الفريق الأول</h3>
                        <span class="text-xs text-slate-400 font-medium bg-slate-900 py-1 px-3 rounded-full">تشكيلة متوازنة</span>
                    </div>
                    <ul id="team1List" class="space-y-2 text-right"></ul>
                </div>

                <!-- الفريق الثاني -->
                <div class="bg-slate-850 border border-blue-500/20 p-5 rounded-xl shadow-lg">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                        <h3 class="text-2xl font-bold text-blue-400">الفريق الثاني</h3>
                        <span class="text-xs text-slate-400 font-medium bg-slate-900 py-1 px-3 rounded-full">تشكيلة متوازنة</span>
                    </div>
                    <ul id="team2List" class="space-y-2 text-right"></ul>
                </div>
            </div>

            <!-- لوحة شرف صبيبة المتة الناتجة -->
            <div id="mateHonorCard" class="hidden bg-amber-950/20 border border-amber-500/20 p-4 rounded-xl text-center">
                <h4 class="text-amber-400 font-bold mb-2">🧉 ضيوف الشرف (صبيبة المتة)</h4>
                <p id="mateHonorNames" class="text-slate-300 font-medium"></p>
            </div>
        </div>
        
    </div>

    <script>
        // قائمة اللاعبين الأساسية
        var players = [
            { id: 1, name: "سامر سعد", position: "جوكر", rating: 5 },
            { id: 2, name: "أحمد رحمان", position: "هجوم", rating: 2 },
            { id: 3, name: "عمرو باظ", position: "هجوم", rating: 3 },
            { id: 4, name: "بشار رعد", position: "دفاع", rating: 2 },
            { id: 5, name: "إبراهيم التجار", position: "دفاع", rating: 3 },
            { id: 6, name: "حامد الناظر", position: "هجوم", rating: 3 },
            { id: 7, name: "حسين عبدالباقي", position: "وسط", rating: 4 },
            { id: 8, name: "خالد التجار", position: "حارس", rating: 2 },
            { id: 9, name: "محمود عقيل", position: "دفاع", rating: 5 },
            { id: 10, name: "مجد الحمصي", position: "هجوم", rating: 4 },
            { id: 11, name: "مناف زيدان", position: "دفاع ووسط", rating: 4 },
            { id: 12, name: "مصطفى حمشو", position: "دفاع ووسط", rating: 4 },
            { id: 13, name: "عبادة القصاب", position: "وسط وهجوم", rating: 4 },
            { id: 14, name: "عمران القصاب", position: "دفاع وهجوم", rating: 4.5 },
            { id: 15, name: "رامي عبده", position: "حارس", rating: 4 },
            { id: 16, name: "ثائر حديد", position: "وسط وهجوم", rating: 3.5 },
            { id: 17, name: "يزن علوية", position: "وسط وهجوم", rating: 3.5 },
            { id: 18, name: "زيد التجار", position: "هجوم ووسط", rating: 4 },
            { id: 19, name: "محمد ملحم", position: "جوكر", rating: 5 },
            { id: 20, name: "خالد عبود", position: "دفاع", rating: 3.5 }
        ];

        var selectedPlayerIds = [];
        var mateServers = [];
        var matchMode = 12;

        function isSelected(id) {
            return selectedPlayerIds.indexOf(id) !== -1;
        }

        function renderPlayers() {
            var grid = document.getElementById('playersGrid');
            if (!grid) return;
            grid.innerHTML = '';
            
            players.forEach(function(p) {
                var checked = isSelected(p.id);
                var card = document.createElement('div');
                
                card.className = "flex items-center justify-between p-3 rounded-xl border transition cursor-pointer select-none " + 
                    (checked ? "border-emerald-500 bg-emerald-950/30 text-emerald-300" : "border-slate-800 bg-slate-855 text-slate-300 hover:bg-slate-800");
                
                card.onclick = function() {
                    togglePlayer(p.id);
                };
                
                var guestBadge = p.isGuest ? `<span class="text-[9px] bg-sky-950 text-sky-400 border border-sky-800 px-1.5 rounded-full">ضيف</span>` : '';
                
                card.innerHTML = `
                    <div class="flex flex-col text-right">
                        <span class="font-bold flex items-center gap-1">${p.name} ${guestBadge}</span>
                        <span class="text-xs text-slate-500">${p.position}</span>
                    </div>
                    <input type="checkbox" ${checked ? 'checked' : ''} class="w-5 h-5 text-emerald-500 rounded bg-slate-800 border-slate-700 focus:ring-emerald-500 focus:ring-offset-slate-900">
                `;
                
                grid.appendChild(card);
            });
            updateUI();
        }

        function togglePlayer(id) {
            var index = selectedPlayerIds.indexOf(id);
            if (index !== -1) {
                selectedPlayerIds.splice(index, 1);
            } else {
                if (selectedPl
