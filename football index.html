<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موزع التشكيلات الذكي</title>
    <!-- Tailwind CSS للواجهة الحديثة والوضع الداكن -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 p-6">
        <h1 class="text-3xl font-bold text-center text-emerald-400 mb-6">موزع التشكيلات الرياضي الذكي</h1>
        
        <!-- قسم إضافة لاعب خارجي (مخفي التقييمات عن الشاشة أيضاً) -->
        <div class="bg-slate-800/50 border border-slate-700/50 p-4 rounded-xl mb-6">
            <h2 class="text-lg font-semibold text-emerald-400 mb-3">إضافة لاعب ضيف</h2>
            <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
                <input id="guestName" type="text" placeholder="اسم اللاعب" class="bg-slate-800 text-white p-2 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                
                <select id="guestPosition" class="bg-slate-800 text-white p-2 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="هجوم">هجوم</option>
                    <option value="وسط">وسط</option>
                    <option value="دفاع">دفاع</option>
                    <option value="حارس">حارس</option>
                    <option value="جوكر">جوكر</option>
                </select>

                <!-- تقييمات مخفية يدخلها المنظم فقط عند إضافة ضيف ولا تظهر لاحقاً -->
                <select id="guestSkill" class="bg-slate-800 text-white p-2 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="">المهارة الفنية</option>
                    <option value="5">ممتاز (5)</option>
                    <option value="4">جيد جداً (4)</option>
                    <option value="3">متوسط (3)</option>
                    <option value="2">مبتدئ (2)</option>
                </select>

                <select id="guestStamina" class="bg-slate-800 text-white p-2 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="">اللياقة البدنية</option>
                    <option value="5">مرتفعة جداً (5)</option>
                    <option value="4">جيدة جداً (4)</option>
                    <option value="3">متوسطة (3)</option>
                    <option value="2">ضعيفة (2)</option>
                </select>

                <button onclick="addGuest()" class="bg-emerald-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-emerald-700 transition">إضافة</button>
            </div>
        </div>

        <!-- قائمة اختيار الحاضرين -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xl font-bold text-slate-200">اختر الحاضرين لليوم (<span id="selectedCount" class="text-emerald-400">0</span> / 12)</h2>
                <button onclick="clearSelection()" class="text-sm text-red-400 hover:underline">إلغاء تحديد الكل</button>
            </div>
            
            <div id="playersGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3">
                <!-- سيتم توليد اللاعبين هنا برمجياً دون إظهار أي تقييمات -->
            </div>
        </div>

        <!-- زر التقسيم -->
        <div class="text-center mb-8">
            <button id="generateBtn" onclick="generateTeams()" disabled class="bg-slate-800 text-slate-500 font-bold text-lg py-3 px-8 rounded-xl cursor-not-allowed border border-slate-700 transition-all">
                يجب اختيار 12 لاعباً لبدء التقسيم
            </button>
        </div>

        <!-- عرض الفرق الناتجة (بدون أرقام القوة) -->
        <div id="resultsSection" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- الفريق الأول -->
            <div class="bg-slate-900 border border-emerald-500/30 p-5 rounded-xl shadow-lg">
                <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                    <h3 class="text-2xl font-bold text-emerald-400">الفريق الأول</h3>
                    <span class="text-xs text-slate-400 font-medium">متوازن حسابياً</span>
                </div>
                <ul id="team1List" class="space-y-2"></ul>
            </div>

            <!-- الفريق الثاني -->
            <div class="bg-slate-900 border border-blue-500/30 p-5 rounded-xl shadow-lg">
                <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                    <h3 class="text-2xl font-bold text-blue-400">الفريق الثاني</h3>
                    <span class="text-xs text-slate-400 font-medium">متوازن حسابياً</span>
                </div>
                <ul id="team2List" class="space-y-2"></ul>
            </div>
        </div>
        
    </div>

    <script>
        // قائمة اللاعبين مع التقييمات التفصيلية المخفية خلف الكواليس
        // تم تقسيم النقاط بناءً على المهارة، اللياقة، والسرعة لتتوافق مع تقييمك الأصلي
        let players = [
            { id: 1, name: "سامر سعد", position: "جوكر", skill: 5, stamina: 5, speed: 5 },
            { id: 2, name: "أحمد رحمان", position: "هجوم", skill: 2, stamina: 2.5, speed: 2 },
            { id: 3, name: "عمرو باظ", position: "هجوم", skill: 3, stamina: 3, speed: 3 },
            { id: 4, name: "بشار رعد", position: "دفاع", skill: 2, stamina: 2, speed: 2 },
            { id: 5, name: "إبراهيم التجار", position: "دفاع", skill: 3, stamina: 3, speed: 3 },
            { id: 6, name: "حامد الناظر", position: "هجوم", skill: 3, stamina: 3, speed: 3 },
            { id: 7, name: "حسين عبدالباقي", position: "وسط", skill: 4, stamina: 4, speed: 4 },
            { id: 8, name: "خالد التجار", position: "حارس", skill: 2, stamina: 2.5, speed: 2 },
            { id: 9, name: "محمود عقيل", position: "دفاع", skill: 5, stamina: 5, speed: 5 },
            { id: 10, name: "مجد الحمصي", position: "هجوم", skill: 4, stamina: 4, speed: 4 },
            { id: 11, name: "مناف زيدان", position: "دفاع ووسط", skill: 4, stamina: 4, speed: 4 },
            { id: 12, name: "مصطفى حمشو", position: "دفاع ووسط", skill: 4, stamina: 4, speed: 4 },
            { id: 13, name: "عبادة القصاب", position: "وسط وهجوم", skill: 4, stamina: 4, speed: 4 },
            { id: 14, name: "عمران القصاب", position: "دفاع وهجوم", skill: 4.5, stamina: 4.5, speed: 4.5 },
            { id: 15, name: "رامي عبده", position: "حارس", skill: 4, stamina: 4, speed: 4 },
            { id: 16, name: "ثائر حديد", position: "وسط وهجوم", skill: 3.5, stamina: 3.5, speed: 3.5 },
            { id: 17, name: "يزن علوية", position: "وسط وهجوم", skill: 3.5, stamina: 3.5, speed: 3.5 },
            { id: 18, name: "زيد التجار", position: "هجوم ووسط", skill: 4, stamina: 4, speed: 4 },
            { id: 19, name: "محمد ملحم", position: "جوكر", skill: 5, stamina: 5, speed: 5 },
            { id: 20, name: "خالد عبود", position: "دفاع", skill: 3.5, stamina: 3.5, speed: 3.5 }
        ];

        let selectedPlayerIds = new Set();

        // حساب التقييم الإجمالي الفعلي خلف الكواليس
        function getOverallRating(player) {
            // يعتمد الحساب على دمج المهارة واللياقة والسرعة بالتساوي
            return (player.skill + player.stamina + (player.speed || player.stamina)) / 3;
        }

        // رسم الواجهة بدون إظهار أي أرقام تقييمية
        function renderPlayers() {
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = '';
            players.forEach(p => {
                const isChecked = selectedPlayerIds.has(p.id);
                const card = document.createElement('div');
                card.className = `flex items-center justify-between p-3 rounded-xl border transition cursor-pointer select-none ${isChecked ? 'border-emerald-500 bg-emerald-950/40 text-emerald-300' : 'border-slate-800 bg-slate-900 text-slate-300 hover:bg-slate-800'}`;
                card.onclick = () => togglePlayer(p.id);
                
                card.innerHTML = `
                    <div class="flex flex-col">
                        <span class="font-bold">${p.name}</span>
                        <span class="text-xs text-slate-500">${p.position}</span>
                    </div>
                    <input type="checkbox" ${isChecked ? 'checked' : ''} class="w-5 h-5 text-emerald-500 rounded bg-slate-800 border-slate-700 focus:ring-emerald-500 focus:ring-offset-slate-900">
                `;
                grid.appendChild(card);
            });
            updateUI();
        }

        function togglePlayer(id) {
            if (selectedPlayerIds.has(id)) {
                selectedPlayerIds.delete(id);
            } else {
                if (selectedPlayerIds.size < 12) {
                    selectedPlayerIds.add(id);
                } else {
                    alert("الحد الأقصى هو 12 لاعباً للمباراة.");
                }
            }
            renderPlayers();
        }

        function clearSelection() {
            selectedPlayerIds.clear();
            renderPlayers();
        }

        function updateUI() {
            const count = selectedPlayerIds.size;
            document.getElementById('selectedCount').innerText = count;
            const btn = document.getElementById('generateBtn');
            if (count === 12) {
                btn.disabled = false;
                btn.className = "bg-emerald-600 text-white font-bold text-lg py-3 px-8 rounded-xl cursor-pointer hover:bg-emerald-500 shadow-lg transition-all border border-emerald-500";
                btn.innerText = "قسّم التشكيلة الآن";
            } else {
                btn.disabled = true;
                btn.className = "bg-slate-850 text-slate-600 font-bold text-lg py-3 px-8 rounded-xl cursor-not-allowed border border-slate-800 transition-all";
                btn.innerText = `يجب اختيار ${12 - count} لاعبين إضافيين`;
            }
        }

        // إضافة لاعب خارجي بتقييمات مخفية
        function addGuest() {
            const name = document.getElementById('guestName').value.trim();
            const position = document.getElementById('guestPosition').value;
            const skill = parseFloat(document.getElementById('guestSkill').value) || 3;
            const stamina = parseFloat(document.getElementById('guestStamina').value) || 3;

            if (!name) {
                alert("الرجاء إدخال اسم اللاعب الضيف.");
                return;
            }

            const newId = players.length + 1;
            const newPlayer = { id: newId, name, position, skill, stamina, speed: stamina };
            players.push(newPlayer);
            
            if (selectedPlayerIds.size < 12) {
                selectedPlayerIds.add(newId);
            }

            document.getElementById('guestName').value = '';
            document.getElementById('guestSkill').selectedIndex = 0;
            document.getElementById('guestStamina').selectedIndex = 0;
            renderPlayers();
        }

        // خوارزمية تقسيم عادلة وعشوائية خلف الكواليس
        function generateTeams() {
            const selectedList = players.filter(p => selectedPlayerIds.has(p.id));
            let acceptableSplits = [];

            for (let i = 0; i < 3000; i++) {
                const shuffled = [...selectedList].sort(() => 0.5 - Math.random());
                
                const team1 = shuffled.slice(0, 6);
                const team2 = shuffled.slice(6, 12);

                const t1Power = team1.reduce((sum, p) => sum + getOverallRating(p), 0);
                const t2Power = team2.reduce((sum, p) => sum + getOverallRating(p), 0);
                
                const diff = Math.abs(t1Power - t2Power);

                const t1GKs = team1.filter(p => p.position.includes('حارس')).length;
                const t2GKs = team2.filter(p => p.position.includes('حارس')).length;
                
                const t1Defs = team1.filter(p => p.position === 'دفاع').length;
                const t2Defs = team2.filter(p => p.position === 'دفاع').length;

                // شروط التوازن التام: فرق قوة أقل من 1.2 نقطة وتوزيع عادل للحراس والمدافعين
                if (diff <= 1.2 && Math.abs(t1GKs - t2GKs) <= 1 && Math.abs(t1Defs - t2Defs) <= 1) {
                    acceptableSplits.push({ team1, team2 });
                }
            }

            let finalSplit;
            if (acceptableSplits.length > 0) {
                // اختيار تقسيم عشوائي لكسر التكرار والملل
                finalSplit = acceptableSplits[Math.floor(Math.random() * acceptableSplits.length)];
            } else {
                // حل بديل في حال لم تطابق الشروط بدقة
                const shuffled = [...selectedList].sort(() => 0.5 - Math.random());
                finalSplit = { team1: shuffled.slice(0, 6), team2: shuffled.slice(6, 12) };
            }

            displayResults(finalSplit);
        }

        // عرض النتائج دون إظهار التقييمات الإجمالية أو الفردية
        function displayResults(split) {
            const resultsSection = document.getElementById('resultsSection');
            const team1List = document.getElementById('team1List');
            const team2List = document.getElementById('team2List');

            team1List.innerHTML = '';
            team2List.innerHTML = '';

            split.team1.forEach(p => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-slate-800/40 border border-slate-700/30 p-3 rounded-lg text-slate-100 font-medium";
                li.innerHTML = `<span>${p.name}</span> <span class="text-xs text-emerald-400 bg-emerald-950/50 border border-emerald-800/30 py-1 px-2.5 rounded-full">${p.position}</span>`;
                team1List.appendChild(li);
            });

            split.team2.forEach(p => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-slate-800/40 border border-slate-700/30 p-3 rounded-lg text-slate-100 font-medium";
                li.innerHTML = `<span>${p.name}</span> <span class="text-xs text-blue-400 bg-blue-950/50 border border-blue-800/30 py-1 px-2.5 rounded-full">${p.position}</span>`;
                team2List.appendChild(li);
            });

            resultsSection.classList.remove('hidden');
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }

        renderPlayers();
    </script>
</body>
</html>
